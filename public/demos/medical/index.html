<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Medical Website Templates</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6fb; color: #0f172a; }
    main { max-width: 1200px; margin: 0 auto; padding: 40px 16px; }
    h1 { margin: 0 0 6px; } p { margin: 0 0 28px; color: #64748b; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { display: flex; flex-direction: column; background: #fff; border-radius: 14px; overflow: hidden;
             text-decoration: none; color: inherit; box-shadow: 0 4px 20px rgba(15, 23, 42, .06); transition: transform .15s; }
    .card:hover { transform: translateY(-3px); }
    .card img { width: 100%; height: 190px; object-fit: cover; object-position: top; background: #e2e8f0; }
    .card span { padding: 14px 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Medical Website Templates</h1>
    <p>9 home page designs (ClinicMaster).</p>
    <div class="grid">
      <a class="card" href="/demos/medical/dentist">
        <img src="/demos/medical/dentist/assets/images/demo/home2.jpg" alt="Dentist template preview" loading="lazy">
        <span>Dentist</span>
      </a>
      <a class="card" href="/demos/medical/medical">
        <img src="/demos/medical/medical/assets/images/demo/home1.jpg" alt="Medical / General Clinic template preview" loading="lazy">
        <span>Medical / General Clinic</span>
      </a>
      <a class="card" href="/demos/medical/pediatrics">
        <img src="/demos/medical/pediatrics/assets/images/demo/home4.jpg" alt="Pediatrics template preview" loading="lazy">
        <span>Pediatrics</span>
      </a>
      <a class="card" href="/demos/medical/gynecology">
        <img src="/demos/medical/gynecology/assets/images/demo/home5.jpg" alt="Gynecology template preview" loading="lazy">
        <span>Gynecology</span>
      </a>
      <a class="card" href="/demos/medical/ophthalmology">
        <img src="/demos/medical/ophthalmology/assets/images/demo/home8.jpg" alt="Ophthalmology / Eye Care template preview" loading="lazy">
        <span>Ophthalmology / Eye Care</span>
      </a>
      <a class="card" href="/demos/medical/skincare">
        <img src="/demos/medical/skincare/assets/images/demo/home3.jpg" alt="Skin Care / Dermatology template preview" loading="lazy">
        <span>Skin Care / Dermatology</span>
      </a>
      <a class="card" href="/demos/medical/plasticsurgery">
        <img src="/demos/medical/plasticsurgery/assets/images/demo/home9.jpg" alt="Plastic Surgery template preview" loading="lazy">
        <span>Plastic Surgery</span>
      </a>
      <a class="card" href="/demos/medical/dieting">
        <img src="/demos/medical/dieting/assets/images/demo/home6.jpg" alt="Dieting / Nutrition template preview" loading="lazy">
        <span>Dieting / Nutrition</span>
      </a>
      <a class="card" href="/demos/medical/fatloss">
        <img src="/demos/medical/fatloss/assets/images/demo/home7.jpg" alt="Fat Loss / Weight Loss template preview" loading="lazy">
        <span>Fat Loss / Weight Loss</span>
      </a>
    </div>
  </main>
</body>
</html>
